<!DOCTYPE html> 
<html>
  <head>
    <title>Loan Amount Calculator</title>
  </head>
  <body>

    <script>
      function getPayment(){
        let worth = document.getElementById("val").value;
        let dp = document.getElementById("downpayment").value;
        let PV = worth - dp;
        let n = document.getElementById("years").value;
        let r = document.getElementById("rate").value;
        let P = ((r/100/12) * PV) / (1-(1+(r/100/12))**-(n*12));
        
        document.getElementById("answer1").innerHTML = "If the initial value is: $" + Number(worth).toFixed(2) + ",";
        document.getElementById("answer2").innerHTML = "and have a downpayment of: $" + Number(dp).toFixed(2) + ",";
        document.getElementById("answer3").innerHTML = "for an initial loan amount of: $" + PV.toFixed(2) + ".";
        document.getElementById("answer4").innerHTML = "If you loan is " + n + " years ( " + 12*Number(n) + " months) at " + Number(r).toFixed(3) + "% interest:";
        document.getElementById("answer6").innerHTML = "Your payments will be $" + P.toFixed(2) + " each month.";
      } 
    </script

    <h1> Loan Payment Calculator</h1>
    <p> <input id ="val"> Enter value of the item </p>
    <p> <input id ="downpayment"> Enter the down payment </p>
    <p> <input id ="years"> Years </p>
    <p> <input id ="rate"> % -- Annual Interest rate </p>
    <br>
    <br>
    <button onclick="getPayment()">Calculate the Monthly Payment</button>
    <br>
    <br>
    <p> <span id="answer1">___</span></p> 
    <p> <span id="answer2">___</span></p> 
    <p> <span id="answer3">___</span></p> 
    <p> <span id="answer4">___</span></p> 
    <br>
    <p> <span id="answer6">___</span></p> 
    <br>
    <br>
  </body>
</html>
